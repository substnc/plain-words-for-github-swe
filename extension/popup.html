<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>GitHub-for-dummies</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="label-small">sub.stnc®</span>
    <h1>GitHub<span>for dummies</span></h1>
  </header>
  <label class="row" for="toggle">
    <span class="label">Förklaringar</span>
    <input type="checkbox" id="toggle" role="switch" checked>
    <span class="switch" aria-hidden="true"></span>
  </label>
  <p id="status" class="status">Pratbubblorna är på.</p>
  <p class="hint">Håll musen över en knapp på github.com en liten stund, så dyker en förklaring upp. Tryck Esc för att stänga den.</p>
  <script src="popup.js"></script>
</body>
</html>
