<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Issues · facebook/react</title>
<style>body{font-family:sans-serif;margin:0} main{padding:16px}</style>
</head>
<body>
<!--HEADER-->
<main>
  <div style="display:flex;gap:8px">
    <input type="text" aria-label="Search Issues" placeholder="is:issue state:open" name="q">
    <a href="/facebook/react/labels" class="prc-Button-ButtonBase-c50BI"><span data-component="text">Labels</span></a>
    <a href="/facebook/react/milestones" class="prc-Button-ButtonBase-c50BI"><span data-component="text">Milestones</span></a>
    <a href="/facebook/react/issues/new/choose" data-variant="primary" class="prc-Button-ButtonBase-c50BI"><span data-component="text">New issue</span></a>
  </div>
  <div role="tablist" style="display:flex;gap:8px;margin-top:12px">
    <a role="tab" href="/facebook/react/issues?q=is%3Aissue%20state%3Aopen" aria-selected="true"><span>Open</span> <span class="Counter">875</span></a>
    <a role="tab" href="/facebook/react/issues?q=is%3Aissue%20state%3Aclosed"><span>Closed</span> <span class="Counter">12,345</span></a>
  </div>
  <h2 style="margin-top:12px"><a href="/facebook/react/pulls">Pull requests</a></h2>
  <a href="/facebook/react/compare" class="btn">New pull request</a>
</main>
</body>
</html>
